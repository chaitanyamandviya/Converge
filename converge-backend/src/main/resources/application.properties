server.port=${PORT:8080}

spring.application.name=converge-backend

# Optional import of local properties for local development (gitignored)
spring.config.import=optional:classpath:application-local.properties

# ==============================================================================
# 1. NETWORK & API RESPONSE OPTIMIZATION (GZIP, HTTP KEEP-ALIVE, LIMITS)
# ==============================================================================
# Enable GZIP compression on JSON, text, and markup payloads to reduce bandwidth by ~75%
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Enforce reasonable payload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=2MB

# Tomcat connection pooling & HTTP keep-alive settings
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=100

# ==============================================================================
# 2. DATABASE CONFIGURATION & HIKARICP CONNECTION POOL TUNING
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/converge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Fine-tuned for serverless PostgreSQL & leak prevention)
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.channel_binding=require
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.leak-detection-threshold=15000

# ==============================================================================
# 3. HIBERNATE ORM QUERY TUNING (N+1 PREVENTION & BATCHING)
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Batch fetching to eliminate N+1 query problem across associations
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Slow query logging to identify database bottlenecks (>500ms)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500

spring.flyway.baseline-on-migrate=true

# ==============================================================================
# 4. MONITORING, ACTUATOR & HEALTH ENDPOINTS
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ==============================================================================
# 5. SECURITY & JWT CONFIGURATION
# ==============================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:7200000}

# ==============================================================================
# 6. EXTERNAL SERVICES (META GRAPH API & RESEND)
# ==============================================================================
# Google OAuth 2.0 Identity Services
google.client-id=${GOOGLE_CLIENT_ID:}

# Meta Instagram Graph API Configuration
instagram.graph-api.base-url=${INSTAGRAM_GRAPH_API_BASE_URL:https://graph.facebook.com/v26.0}
instagram.graph-api.access-token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.graph-api.business-account-id=${INSTAGRAM_BUSINESS_ACCOUNT_ID:}

# Resend Email Service Configuration
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:Converge <onboarding@resend.dev>}
resend.admin-email=${RESEND_ADMIN_EMAIL:chaitanyamandviya7@gmail.com}

# Gmail SMTP Configuration (Optional - delivers directly to any recipient via Gmail App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend Application URL for Emails and Redirects
app.frontend-url=${FRONTEND_URL:https://converge-etp.pages.dev}
