spring.application.name=converge-backend
server.port=${PORT:8080}

# PostgreSQL (Neon) via .env / Render env vars
spring.datasource.url=${DATABASE_URL:${DB_URL:}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning for serverless Postgres (Neon)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App Config
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.cors.extra-origins=${CORS_ALLOWED_ORIGINS:}
app.frontend.url=${FRONTEND_URL:https://converge-etp.pages.dev}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.admin.email=${ADMIN_EMAIL:admin@converge.run.place}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@converge.run.place}
app.brevo.sender-name=${BREVO_SENDER_NAME:Converge}

# Meta / Instagram Graph API
app.instagram.base-url=${INSTAGRAM_GRAPH_API_BASE_URL:https://graph.facebook.com/v26.0}
app.instagram.graph-base-url=${INSTAGRAM_API_BASE_URL:https://graph.instagram.com/v26.0}
app.instagram.app-id=${INSTAGRAM_APP_ID:}
app.instagram.app-secret=${INSTAGRAM_APP_SECRET:}
app.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
app.instagram.business-account-id=${INSTAGRAM_BUSINESS_ACCOUNT_ID:}
app.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:https://converge-etp.pages.dev/workspace}
app.instagram.creator-marketplace-enabled=${INSTAGRAM_CREATOR_MARKETPLACE_ENABLED:false}
